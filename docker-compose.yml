services:
  supawake:
    build: .
    restart: unless-stopped
    environment:
      # One block per Supabase project, numbered from 1 upwards.
      SUPABASE_1_NAME: ${SUPABASE_1_NAME:-supabase-1}
      SUPABASE_1_URL: ${SUPABASE_1_URL}
      SUPABASE_1_KEY: ${SUPABASE_1_KEY}
      # Required to actually keep the database awake: an anon-readable table.
      SUPABASE_1_TABLE: ${SUPABASE_1_TABLE:-keepalive}
      # Heartbeat function that writes a row on each ping (supabase-sql-config.md).
      SUPABASE_1_RPC: ${SUPABASE_1_RPC:-supawake_heartbeat}
      # Optional: sign in as a dedicated Auth user on each ping, like a real visitor.
      SUPABASE_1_EMAIL: ${SUPABASE_1_EMAIL:-}
      SUPABASE_1_PASSWORD: ${SUPABASE_1_PASSWORD:-}

      # Optional: personal access token - restores projects that got paused anyway.
      SUPABASE_ACCESS_TOKEN: ${SUPABASE_ACCESS_TOKEN:-}

      # Cron schedule for "supawake start". Every 4 hours: Supabase wants "a few
      # user requests to the database each day", and every 3 days was not enough.
      SUPAWAKE_INTERVAL: ${SUPAWAKE_INTERVAL:-17 */4 * * *}

      # Optional: Slack-compatible webhook posted to when a ping fails.
      # SUPAWAKE_WEBHOOK_URL: ${SUPAWAKE_WEBHOOK_URL}
