name: supawake

on:
  schedule:
    # Every 6 hours. Supabase wants "a few user requests to the database each
    # day"; every 3 days let projects pause with every run green.
    # GitHub disables scheduled workflows after 60 days without a commit, so
    # the Docker deployment is the primary pinger and this is a backup.
    - cron: '23 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Build from this checkout rather than "npm install -g supawake": that
      # pulls the upstream package from the registry, so none of the fixes in
      # this repository would ever run here.
      - name: Build supawake
        run: |
          npm ci
          npm run build

      - name: Write config from secret
        run: |
          mkdir -p "$HOME/.config/supawake"
          echo "$SUPAWAKE_CONFIG" > "$HOME/.config/supawake/config.json"
        env:
          SUPAWAKE_CONFIG: ${{ secrets.SUPAWAKE_CONFIG }}

      - name: Ping all projects
        run: node dist/index.js ping
        env:
          # Optional: lets the run restore a project that got paused anyway.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
